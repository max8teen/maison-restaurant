<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>My Profile — Maison</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@200;300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet"/>
<script>
tailwind.config={theme:{extend:{colors:{ink:{DEFAULT:'#0a0b0d',light:'#131518',elevated:'#1a1c20'},cream:{DEFAULT:'#f2edd8',dim:'#ccc4a8'},gold:{DEFAULT:'#c49a3c',light:'#caa94f',dim:'#7a6a35'}}}}}
</script>
<style>
body{font-family:'Outfit',sans-serif;background:#0a0b0d;color:#f2edd8;-webkit-font-smoothing:antialiased;margin:0;}
h1,h2,h3,h4{font-family:'Playfair Display',serif;}
.font-display{font-family:'Playfair Display',serif;}
.font-mono-dm{font-family:'JetBrains Mono',monospace;}
.text-gradient-gold{background:linear-gradient(135deg,#c49a3c,#d4b96a,#c49a3c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hr-gold{height:1px;background:linear-gradient(90deg,transparent,rgba(196,154,60,0.5),transparent);border:none;}
.noise::before{content:'';position:absolute;inset:0;opacity:0.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");pointer-events:none;}
.glass{background:rgba(26,28,32,0.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(196,154,60,0.08);}
.input-premium{width:100%;padding:14px 20px;font-size:14px;outline:none;transition:all 0.3s;background:rgba(26,28,32,0.8);border:1px solid rgba(196,154,60,0.1);color:#f2edd8;font-family:'Outfit',sans-serif;box-sizing:border-box;}
.input-premium:focus{border-color:rgba(196,154,60,0.4);box-shadow:0 0 0 3px rgba(196,154,60,0.06);}
.input-premium::placeholder{color:rgba(100,110,130,0.6);}
.input-premium:disabled{opacity:0.6;cursor:not-allowed;}
.select-premium{width:100%;padding:14px 20px;font-size:14px;outline:none;transition:all 0.3s;background:rgba(26,28,32,0.8);border:1px solid rgba(196,154,60,0.1);color:#f2edd8;font-family:'Outfit',sans-serif;box-sizing:border-box;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23c49a3c' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 16px center;}
.select-premium:focus{border-color:rgba(196,154,60,0.4);box-shadow:0 0 0 3px rgba(196,154,60,0.06);}
.select-premium:disabled{opacity:0.6;cursor:not-allowed;}
.select-premium option{background:#1a1c20;color:#f2edd8;}
.btn-premium{position:relative;overflow:hidden;padding:16px 32px;font-size:11px;letter-spacing:0.25em;text-transform:uppercase;font-family:'Outfit',sans-serif;font-weight:500;background:linear-gradient(135deg,#b8903a,#c9a24a);color:#0a0b0d;border:none;cursor:pointer;transition:all 0.3s;text-decoration:none;display:inline-block;text-align:center;}
.btn-premium:hover{background:linear-gradient(135deg,#c9a24a,#d4b45a);box-shadow:0 8px 32px -8px rgba(196,154,60,0.4);transform:translateY(-1px);}
.btn-premium:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-outline-gold{padding:14px 28px;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;font-family:'Outfit',sans-serif;background:transparent;border:1px solid rgba(196,154,60,0.25);color:rgba(196,154,60,0.7);cursor:pointer;transition:all 0.3s;text-decoration:none;display:inline-block;text-align:center;}
.btn-outline-gold:hover{border-color:rgba(196,154,60,0.5);color:#c49a3c;}
::selection{background:rgba(196,154,60,0.3);color:#f2edd8;}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.animate-fade-up{animation:fadeUp 0.6s ease both;}
.avatar-ring{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,#c49a3c,#d4b96a);padding:3px;display:flex;align-items:center;justify-content:center;}
.avatar-inner{width:100%;height:100%;border-radius:50%;background:#1a1c20;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:36px;color:#c49a3c;font-weight:500;}
.toast{position:fixed;bottom:24px;right:24px;padding:14px 24px;background:rgba(26,28,32,0.95);border:1px solid rgba(196,154,60,0.2);color:#f2edd8;font-size:13px;font-family:'Outfit',sans-serif;z-index:9999;transform:translateY(100px);opacity:0;transition:all 0.4s ease;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.success{border-color:rgba(74,222,128,0.3);}

/* ── Unified Navbar ─────────────────────────────────────────── */
.mn{position:fixed;top:0;left:0;right:0;z-index:100;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;background:transparent;border-bottom:1px solid transparent;transition:all .4s;}
.mn.scrolled{background:rgba(12,13,16,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(196,154,60,.08);}
.mn-logo{font-family:'Playfair Display',serif;font-size:19px;letter-spacing:.28em;background:linear-gradient(135deg,#c49a3c,#d4b96a,#c49a3c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none;font-weight:500;}
.mn-links{display:flex;align-items:center;gap:32px;}
.mn-link{color:rgba(242,237,216,.4);font-size:10px;letter-spacing:.25em;text-transform:uppercase;text-decoration:none;font-family:'Outfit',sans-serif;background:none;border:none;cursor:pointer;padding:0;transition:color .2s;}
.mn-link:hover{color:rgba(242,237,216,.85);}
.mn-link.mn-active{color:#c49a3c;}
.mn-btn{color:#c49a3c;font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-family:'Outfit',sans-serif;background:none;border:1px solid rgba(196,154,60,.25);cursor:pointer;padding:8px 18px;transition:all .2s;text-decoration:none;display:inline-block;}
.mn-btn:hover{border-color:#c49a3c;background:rgba(196,154,60,.06);}
.mn-ham{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:8px;-webkit-tap-highlight-color:transparent;z-index:101;}
.mn-hb{width:22px;height:2px;background:#c49a3c;border-radius:1px;transition:all .28s ease;}
.mn-ham.open .mn-hb:nth-child(1){transform:translateY(7px) rotate(45deg);}
.mn-ham.open .mn-hb:nth-child(2){opacity:0;}
.mn-ham.open .mn-hb:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
.mn-drawer{display:none;position:fixed;top:64px;left:0;right:0;background:#0c0d10;border-bottom:1px solid rgba(196,154,60,.12);z-index:99;padding:6px 0 18px;}
.mn-drawer.open{display:block;}
.mn-mi{display:block;padding:14px 28px;color:rgba(242,237,216,.4);font-size:11px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;font-family:'Outfit',sans-serif;border:none;background:none;width:100%;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:color .2s;}
.mn-mi:hover{color:#f2edd8;}
.mn-mi-gold{color:#c49a3c !important;}
.mn-mi-red{color:#f87171 !important;}
.mn-mdiv{height:1px;background:rgba(196,154,60,.08);margin:8px 24px;}
@media(max-width:700px){.mn{padding:0 16px;}.mn-links{display:none;}.mn-ham{display:flex;}}
</style>
</head>
<body>

<!-- Navbar -->
<nav class="mn" id="mainNav">
  <a href="index.html" class="mn-logo">MAISON</a>
  <div class="mn-links" id="mnLinks"></div>
  <button class="mn-ham" id="mnHam" onclick="mnToggle()" aria-label="Menu">
    <span class="mn-hb"></span><span class="mn-hb"></span><span class="mn-hb"></span>
  </button>
</nav>
<div class="mn-drawer" id="mnDrawer">
  <div class="mn-mdiv"></div>
  <a href="index.html" class="mn-mi">Home</a>
  <a href="book.html" class="mn-mi">Reserve</a>
  <a href="my-bookings.html" class="mn-mi">My Bookings</a>
  <div id="mnAdminMob"></div>
  <div class="mn-mdiv"></div>
  <div id="mnAuthMob"></div>
</div>
</div>

<!-- Profile Section -->
<section class="relative min-h-screen pt-28 pb-20 px-4 sm:px-8">
  <div class="absolute inset-0" style="background:radial-gradient(ellipse at 30% 20%,rgba(196,154,60,0.06),transparent 50%),radial-gradient(ellipse at 70% 80%,rgba(100,50,120,0.04),transparent 50%)"></div>
  <div class="absolute inset-0 noise"></div>

  <div class="relative z-10 max-w-full mx-auto px-2 sm:px-6 lg:px-16 xl:px-28 animate-fade-up">

    <!-- Header -->
    <div class="text-center mb-10">
      <div class="avatar-ring mx-auto mb-5">
        <div class="avatar-inner" id="avatarInitial">…</div>
      </div>
      <div class="font-mono-dm text-[10px] tracking-[0.5em] uppercase text-gold/40 mb-2">Your Profile</div>
      <h1 class="font-display text-[clamp(28px,6vw,38px)] text-cream/90 font-medium mb-2" id="displayName">Loading…</h1>
      <div class="font-mono-dm text-[11px] tracking-[0.15em] text-cream/25">Member Since · <span class="text-gold/50" id="memberSince">—</span></div>
    </div>

    <div class="hr-gold mb-8"></div>

    <!-- Profile Card -->
    <div class="glass p-6 sm:p-8 lg:p-10" style="border-radius:2px;">
      <div class="flex items-center justify-between mb-8">
        <span class="font-mono-dm text-[10px] tracking-[0.3em] uppercase text-cream/30">Personal Information</span>
        <button onclick="toggleEdit()" id="editBtn" class="btn-outline-gold py-2 px-4 text-[9px]">Edit</button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-5">
        <!-- Name -->
        <div>
          <label class="block font-mono-dm text-[10px] tracking-[0.3em] uppercase text-cream/25 mb-2.5">Full Name</label>
          <input type="text" id="name" value="" class="input-premium" disabled/>
        </div>

        <!-- Email -->
        <div>
          <label class="block font-mono-dm text-[10px] tracking-[0.3em] uppercase text-cream/25 mb-2.5">Email Address</label>
          <input type="email" id="email" value="" class="input-premium" disabled/>
        </div>

        <!-- Phone -->
        <div>
          <label class="block font-mono-dm text-[10px] tracking-[0.3em] uppercase text-cream/25 mb-2.5">Phone Number</label>
          <input type="tel" id="phone" value="" class="input-premium" disabled/>
        </div>

        <!-- Gender -->
        <div>
          <label class="block font-mono-dm text-[10px] tracking-[0.3em] uppercase text-cream/25 mb-2.5">Gender</label>
          <select id="gender" class="select-premium" disabled>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
            <option value="prefer-not">Prefer not to say</option>
          </select>
        </div>

        <!-- DOB -->
        <div class="md:col-span-2 md:max-w-[calc(50%-1rem)]">
          <label class="block font-mono-dm text-[10px] tracking-[0.3em] uppercase text-cream/25 mb-2.5">Date of Birth</label>
          <input type="date" id="dob" value="" class="input-premium" disabled/>
        </div>
      </div>

      <div class="hr-gold my-8"></div>

      <!-- Member Since Badge + Actions -->
      <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-full flex items-center justify-center" style="background:rgba(196,154,60,0.1);border:1px solid rgba(196,154,60,0.15);">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c49a3c" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <div>
            <div class="font-mono-dm text-[9px] tracking-[0.3em] uppercase text-cream/20">Member Since</div>
            <div class="font-mono-dm text-[12px] text-gold/70" id="memberBadge">—</div>
          </div>
        </div>
        <div class="flex gap-3">
          <button onclick="saveProfile()" id="saveBtn" class="btn-premium w-full sm:w-auto hidden">Save Changes</button>
          <button onclick="cancelEdit()" id="cancelBtn" class="btn-outline-gold py-3 px-6 hidden">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Danger Zone -->
    <div class="glass p-6 sm:p-8 mt-6" style="border-radius:2px;border-color:rgba(239,68,68,0.1);">
      <div class="font-mono-dm text-[10px] tracking-[0.3em] uppercase text-red-400/60 mb-4">Danger Zone</div>
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
        <div>
          <div class="text-cream/60 text-sm">Delete Account</div>
          <div class="text-cream/20 text-[12px]">This action cannot be undone</div>
        </div>
        <button onclick="if(confirm('Are you sure you want to delete your account? This cannot be undone.'))toast('Account deletion requested','success')" class="py-2.5 px-5 text-[10px] tracking-[0.2em] uppercase font-mono-dm bg-transparent border border-red-400/20 text-red-400/60 cursor-pointer hover:border-red-400/50 hover:text-red-400 transition-all">Delete</button>
      </div>
    </div>

  </div>
</section>

<!-- Toast -->
<div id="toastEl" class="toast"></div>

<script>
// ── Auth check ────────────────────────────────────────────────
const _token = localStorage.getItem('maison_token') || '';
if (!_token) { sessionStorage.setItem('login_redirect','profile.html'); window.location.href='login.html'; }

let _originalData = {};

// ── Load profile from API ─────────────────────────────────────
async function loadProfile() {
  try {
    const res  = await fetch('api/get-profile?t=' + encodeURIComponent(_token), {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({_token})
    });
    const data = await res.json();
    if (!data.success) { window.location.href = 'login.html'; return; }
    fillForm(data.data.user);
  } catch(e) {
    toast('Could not load profile. Check connection.', 'error');
  }
}

// ── Fill form with real user data ─────────────────────────────
function fillForm(u) {
  _originalData = u;

  // Avatar initials
  const initials = (u.full_name || 'U').split(' ').map(w => w[0]).join('').toUpperCase().slice(0,1);
  document.getElementById('avatarInitial').textContent = initials;
  document.getElementById('displayName').textContent   = u.full_name || '—';

  // Member since
  if (u.created_at) {
    const d = new Date(u.created_at);
    const fmt = d.toLocaleDateString('en-IN', {year:'numeric', month:'long'});
    document.getElementById('memberSince').textContent = fmt;
    document.getElementById('memberBadge').textContent = fmt;
  }

  // Fields
  document.getElementById('name').value   = u.full_name || '';
  document.getElementById('email').value  = u.email     || '';
  document.getElementById('phone').value  = u.phone     || '';
  document.getElementById('dob').value    = u.dob       || '';

  // Gender select
  const gsel = document.getElementById('gender');
  const gval = u.gender || '';
  for (let i = 0; i < gsel.options.length; i++) {
    if (gsel.options[i].value === gval) { gsel.selectedIndex = i; break; }
  }
}

// ── Edit mode ─────────────────────────────────────────────────
let editing = false;
const editableFields = ['name','phone','gender','dob']; // email always disabled

function toggleEdit() {
  editing = true;
  editableFields.forEach(id => document.getElementById(id).disabled = false);
  document.getElementById('editBtn').style.display = 'none';
  document.getElementById('saveBtn').classList.remove('hidden');
  document.getElementById('cancelBtn').classList.remove('hidden');
}

function cancelEdit() {
  editing = false;
  fillForm(_originalData);
  editableFields.forEach(id => document.getElementById(id).disabled = true);
  document.getElementById('editBtn').style.display = '';
  document.getElementById('saveBtn').classList.add('hidden');
  document.getElementById('cancelBtn').classList.add('hidden');
}

// ── Save to API ───────────────────────────────────────────────
async function saveProfile() {
  const name = document.getElementById('name').value.trim();
  if (!name) { toast('Name is required', 'error'); return; }

  const saveBtn = document.getElementById('saveBtn');
  saveBtn.textContent = 'Saving…';
  saveBtn.disabled    = true;

  const payload = {
    _token,
    full_name: name,
    phone:     document.getElementById('phone').value.trim(),
    gender:    document.getElementById('gender').value,
    dob:       document.getElementById('dob').value,
  };

  try {
    const res  = await fetch('api/update-profile?t=' + encodeURIComponent(_token), {
      method:  'POST',
      headers: {'Content-Type':'application/json'},
      body:    JSON.stringify(payload)
    });
    const data = await res.json();

    saveBtn.textContent = 'Save Changes';
    saveBtn.disabled    = false;

    if (data.success) {
      // Update localStorage name
      try {
        const u = JSON.parse(localStorage.getItem('maison_user') || '{}');
        u.full_name = name;
        localStorage.setItem('maison_user', JSON.stringify(u));
      } catch(e) {}

      fillForm(data.data.user);
      cancelEdit();
      toast('Profile updated successfully', 'success');
    } else {
      toast(data.message || 'Update failed', 'error');
    }
  } catch(e) {
    saveBtn.textContent = 'Save Changes';
    saveBtn.disabled    = false;
    toast('No internet connection', 'error');
  }
}

// ── Toast ─────────────────────────────────────────────────────
function toast(msg, type) {
  const t = document.getElementById('toastEl');
  t.textContent = msg;
  t.className   = 'toast show' + (type === 'success' ? ' success' : '');
  setTimeout(() => t.className = 'toast', 3500);
}

// ── Init ──────────────────────────────────────────────────────
loadProfile();
</script>

<script>
(function initNav(){
  var base=window.location.pathname.indexOf('/admin/')>-1?'../':'';
  var token=localStorage.getItem('maison_token')||'';
  var user=null;
  try{user=JSON.parse(localStorage.getItem('maison_user'));}catch(e){}
  var isAdmin=user&&user.role==='admin';
  var page=window.location.pathname.split('/').pop()||'index.html';
  function lnk(href,label,active){return '<a href="'+base+href+'" class="mn-link'+(active?' mn-active':'')+'" >'+label+'</a>';}
  var desk=document.getElementById('mnLinks');
  var mobAuth=document.getElementById('mnAuthMob');
  var mobAdmin=document.getElementById('mnAdminMob');
  if(user&&token){
    desk.innerHTML=
      lnk('index.html','Home',page==='index.html')+
      lnk('book.html','Reserve',page==='book.html')+
      lnk('menu.html','Menu',page==='menu.html')+
      lnk('my-bookings.html','Bookings',page==='my-bookings.html')+
      lnk('profile.html','Profile',page==='profile.html')+
      lnk('about.html','About',page==='about.html')+
      (isAdmin?lnk('admin/index.html','Admin',false):'')+
      '<button onclick="mnSignOut()" class="mn-btn">Sign Out</button>';
    if(mobAdmin&&isAdmin)mobAdmin.innerHTML='<a href="'+base+'admin/index.html" class="mn-mi mn-mi-gold">Admin Panel</a>';
    if(mobAuth)mobAuth.innerHTML='<button onclick="mnSignOut()" class="mn-mi mn-mi-red">Sign Out</button>';
  }else{
    desk.innerHTML=
      lnk('index.html','Home',page==='index.html')+
      lnk('book.html','Reserve',page==='book.html')+
      lnk('menu.html','Menu',page==='menu.html')+
      lnk('about.html','About',page==='about.html')+
      '<a href="'+base+'login.html" class="mn-btn">Sign In</a>';
    if(mobAuth)mobAuth.innerHTML='<a href="'+base+'login.html" class="mn-mi mn-mi-gold">Sign In</a><a href="'+base+'register.html" class="mn-mi">Create Account</a>';
  }
  document.querySelectorAll('.mn-drawer a[href]').forEach(function(a){
    var h=a.getAttribute('href');
    if(h&&!h.startsWith('http')&&!h.startsWith(base)&&base)a.href=base+h;
  });
})();
function mnToggle(){document.getElementById('mnHam').classList.toggle('open');document.getElementById('mnDrawer').classList.toggle('open');}
document.addEventListener('click',function(e){var h=document.getElementById('mnHam'),d=document.getElementById('mnDrawer');if(h&&d&&!h.contains(e.target)&&!d.contains(e.target)){h.classList.remove('open');d.classList.remove('open');}});
window.addEventListener('scroll',function(){document.getElementById('mainNav').classList.toggle('scrolled',window.scrollY>10);});
function mnSignOut(){localStorage.removeItem('maison_token');localStorage.removeItem('maison_user');window.location.href=(window.location.pathname.indexOf('/admin/')>-1?'../':'')+'index.html';}
</script>
</body>
</html>
