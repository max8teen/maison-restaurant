<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Tables — Maison Admin</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0b0d'/><text y='26' x='4' font-size='24' fill='%23c49a3c' font-family='Georgia,serif'>M</text></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="admin.css"/>
</head>
<body>

<div id="sidebar-overlay" onclick="closeSidebar()"></div>
<aside id="sidebar">
  <div class="sidebar-logo"><div class="logo-mark"><div class="logo-gem">M</div><div><div class="logo-text">Maison</div><div class="logo-sub">Admin Panel</div></div></div></div>
  <div class="nav-items">
    <div class="nav-section">Main</div>
    <a href="index.html"        class="nav-item"><span class="nav-icon">◈</span> Dashboard</a>
    <a href="reservations.html" class="nav-item"><span class="nav-icon">◧</span> Reservations</a>
    <a href="tables.html"       class="nav-item active"><span class="nav-icon">⬡</span> Tables</a>
    <div class="nav-section">People</div>
    <a href="customers.html"    class="nav-item"><span class="nav-icon">◉</span> Customers</a>
    <div class="nav-section">Analytics</div>
    <a href="reports.html"      class="nav-item"><span class="nav-icon">▦</span> Reports</a>
    <div class="nav-section">Content</div>
    <a href="reviews.html"      class="nav-item"><span class="nav-icon">★</span> Reviews <span class="nav-badge" id="reviews-pending-badge">0</span></a>
    <div class="nav-section">System</div>
    <a href="settings.html"     class="nav-item"><span class="nav-icon">⚙</span> Settings</a>
  </div>
  <div class="sidebar-footer"><div class="user-card"><div class="avatar">A</div><div><div class="user-name" id="admin-name">Admin</div><div class="user-role">● ADMIN</div></div><button class="logout-btn" onclick="doLogout()">⇥</button></div></div>
</aside>

<div id="main">
  <div class="topbar">
    <div class="topbar-left">
      <button class="hamburger-btn" onclick="toggleSidebar()"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h14M3 10h14M3 14h14"/></svg></button>
      <div><div class="topbar-title">Tables</div><div class="topbar-crumb">Maison / Tables</div></div>
    </div>
    <div class="topbar-right">
      <button class="topbar-btn btn-gold-style" onclick="openModal('table-modal')">+ Add Table</button>
    </div>
  </div>

  <div class="page-content">
    <!-- Table Stats -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px;" id="table-stats"></div>

    <!-- Floor Plan -->
    <div class="card" style="margin-bottom:16px;">
      <div class="card-head"><span class="card-title">Floor Plan</span></div>
      <div class="floor-grid" id="floor-grid"></div>
    </div>

    <!-- Table List -->
    <div class="card">
      <div class="card-head"><span class="card-title">Table List</span></div>
      <div class="tbl-wrap">
        <table class="data-table">
          <thead><tr><th>#</th><th>Capacity</th><th>Location</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="tables-tbody"><tr><td colspan="5" style="text-align:center;color:var(--muted);padding:40px;">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Add Table Modal -->
<div class="modal-bg" id="table-modal">
  <div class="modal">
    <div class="modal-head"><div class="modal-title">Add Table</div><button class="modal-close" onclick="closeModal('table-modal')">×</button></div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group"><label class="form-label">Table Number</label><input class="inp" id="tb-num" type="number" min="1" placeholder="11"/></div>
        <div class="form-group"><label class="form-label">Capacity</label><input class="inp" id="tb-cap" type="number" min="1" max="20" value="4"/></div>
      </div>
      <div class="form-group"><label class="form-label">Location</label>
        <select class="inp" id="tb-loc">
          <option>Main Hall</option><option>Window</option><option>Garden</option><option>Private</option><option>Bar</option><option>Terrace</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">Status</label>
        <select class="inp" id="tb-status">
          <option>available</option><option>reserved</option><option>maintenance</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('table-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveTable()">Add Table</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="admin.js"></script>
<script>
async function loadTables() {
  const res = await apiCall('POST', 'get-all-tables');
  if (!res.success) { toast(res.message, 'error'); return; }
  const tables = res.data.tables || [];
  renderTables(tables);
}

function renderTables(tables) {
  const counts = { available: 0, occupied: 0, reserved: 0, maintenance: 0 };
  tables.forEach(t => { if (counts[t.status] !== undefined) counts[t.status]++; });

  document.getElementById('table-stats').innerHTML = Object.entries(counts).map(([k, v]) => `
    <div class="stat-card" style="padding:14px 18px;">
      <div class="stat-stripe" style="background:linear-gradient(90deg,${TABLE_COLORS[k]},transparent)"></div>
      <div class="stat-label">${k}</div>
      <div class="stat-val" style="font-size:28px;color:${TABLE_COLORS[k]};">${v}</div>
    </div>`).join('');

  document.getElementById('floor-grid').innerHTML = tables.map(t => `
    <div class="table-tile" style="background:${TABLE_COLORS[t.status]}18;border-color:${TABLE_COLORS[t.status]}44;" title="${t.location} · ${t.capacity} guests · ${t.status}">
      <div style="font-family:'Instrument Serif',serif;font-size:16px;">${t.table_number}</div>
      <div style="font-size:10px;font-family:'DM Mono',monospace;color:var(--muted2);margin-top:2px;">${t.capacity}p</div>
      <div style="font-size:9px;text-transform:uppercase;letter-spacing:.06em;margin-top:3px;color:${TABLE_COLORS[t.status]};">${t.status}</div>
    </div>`).join('');

  document.getElementById('tables-tbody').innerHTML = tables.map(t => `
    <tr>
      <td><span style="font-family:'DM Mono',monospace;font-weight:600;color:var(--gold);">${t.table_number}</span></td>
      <td>${t.capacity} guests</td>
      <td style="color:var(--muted2);">${t.location}</td>
      <td>
        <select onchange="updateTableStatus(${t.id},this.value)" style="background:${TABLE_COLORS[t.status]}18;border:1px solid ${TABLE_COLORS[t.status]}44;border-radius:6px;padding:4px 8px;color:${TABLE_COLORS[t.status]};font-size:11px;cursor:pointer;outline:none;font-family:'DM Mono',monospace;">
          ${['available','occupied','reserved','maintenance'].map(s=>`<option value="${s}" ${t.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </td>
      <td><button onclick="deleteTable(${t.id})" class="btn btn-danger btn-sm">Delete</button></td>
    </tr>`).join('');
}

async function updateTableStatus(id, status) {
  const res = await apiCall('POST', 'update-table', { id, status });
  if (!res.success) { toast(res.message, 'error'); return; }
  toast('Table updated to ' + status);
  loadTables();
}

async function deleteTable(id) {
  if (!confirm('Delete this table?')) return;
  const res = await apiCall('POST', 'delete-table', { id });
  if (!res.success) { toast(res.message, 'error'); return; }
  toast('Table deleted', 'info');
  loadTables();
}

async function saveTable() {
  const num = parseInt(document.getElementById('tb-num').value);
  const cap = parseInt(document.getElementById('tb-cap').value) || 4;
  if (!num) { toast('Table number required', 'error'); return; }

  const res = await apiCall('POST', 'add-table', {
    table_number: 'T' + num,
    capacity: cap,
    location: document.getElementById('tb-loc').value,
    status: document.getElementById('tb-status').value
  });

  if (!res.success) { toast(res.message, 'error'); return; }
  closeModal('table-modal');
  toast('Table T' + num + ' added');
  document.getElementById('tb-num').value = '';
  loadTables();
}

loadTables();
</script>
</body>
</html>
