<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Create Account — Maison</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@200;300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet"/>
<script>
tailwind.config={theme:{extend:{colors:{ink:{DEFAULT:'#0a0b0d',light:'#131518',elevated:'#1a1c20'},cream:{DEFAULT:'#f2edd8',dim:'#ccc4a8'},gold:{DEFAULT:'#c49a3c',light:'#caa94f',dim:'#7a6a35'}}}}}
</script>
<style>
body{font-family:'Outfit',sans-serif;background:#0a0b0d;color:#f2edd8;-webkit-font-smoothing:antialiased;margin:0;}
h1,h2{font-family:'Playfair Display',serif;}
.font-display{font-family:'Playfair Display',serif;}
.font-mono-dm{font-family:'JetBrains Mono',monospace;}
.text-gradient-gold{background:linear-gradient(135deg,#c49a3c,#d4b96a,#c49a3c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hr-gold{height:1px;background:linear-gradient(90deg,transparent,rgba(196,154,60,0.5),transparent);border:none;}
.noise::before{content:'';position:absolute;inset:0;opacity:0.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");pointer-events:none;}
.input-premium{width:100%;padding:14px 20px;font-size:14px;outline:none;transition:all 0.3s;background:rgba(26,28,32,0.8);border:1px solid rgba(196,154,60,0.1);color:#f2edd8;font-family:'Outfit',sans-serif;box-sizing:border-box;}
.input-premium:focus{border-color:rgba(196,154,60,0.4);box-shadow:0 0 0 3px rgba(196,154,60,0.06);}
.input-premium::placeholder{color:rgba(100,110,130,0.6);}
.btn-premium{width:100%;padding:16px 32px;font-size:11px;letter-spacing:0.25em;text-transform:uppercase;font-family:'Outfit',sans-serif;font-weight:500;background:linear-gradient(135deg,#b8903a,#c9a24a);color:#0a0b0d;border:none;cursor:pointer;transition:all 0.3s;}
.btn-premium:hover{background:linear-gradient(135deg,#c9a24a,#d4b45a);box-shadow:0 8px 32px -8px rgba(196,154,60,0.4);transform:translateY(-1px);}
.btn-premium:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none;}
.otp-inp{flex:1;min-width:0;aspect-ratio:1;max-width:52px;text-align:center;font-size:20px;font-family:'JetBrains Mono',monospace;padding:0;}
::selection{background:rgba(196,154,60,0.3);color:#f2edd8;}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.animate-fade-up{animation:fadeUp 0.6s ease both;}
.mn{position:fixed;top:0;left:0;right:0;z-index:100;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;background:transparent;border-bottom:1px solid transparent;transition:all .4s;}
.mn.scrolled{background:rgba(12,13,16,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(196,154,60,.08);}
.mn-logo{font-family:'Playfair Display',serif;font-size:19px;letter-spacing:.28em;background:linear-gradient(135deg,#c49a3c,#d4b96a,#c49a3c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none;font-weight:500;}
.mn-links{display:flex;align-items:center;gap:32px;}
.mn-link{color:rgba(242,237,216,.4);font-size:10px;letter-spacing:.25em;text-transform:uppercase;text-decoration:none;font-family:'Outfit',sans-serif;background:none;border:none;cursor:pointer;padding:0;transition:color .2s;}
.mn-link:hover{color:rgba(242,237,216,.85);}
.mn-link.mn-active{color:#c49a3c;}
.mn-btn{color:#c49a3c;font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-family:'Outfit',sans-serif;background:none;border:1px solid rgba(196,154,60,.25);cursor:pointer;padding:8px 18px;transition:all .2s;text-decoration:none;display:inline-block;}
.mn-btn:hover{border-color:#c49a3c;background:rgba(196,154,60,.06);}
.mn-ham{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:8px;-webkit-tap-highlight-color:transparent;z-index:101;}
.mn-hb{width:22px;height:2px;background:#c49a3c;border-radius:1px;transition:all .28s ease;}
.mn-ham.open .mn-hb:nth-child(1){transform:translateY(7px) rotate(45deg);}
.mn-ham.open .mn-hb:nth-child(2){opacity:0;}
.mn-ham.open .mn-hb:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
.mn-drawer{display:none;position:fixed;top:64px;left:0;right:0;background:#0c0d10;border-bottom:1px solid rgba(196,154,60,.12);z-index:99;padding:6px 0 18px;}
.mn-drawer.open{display:block;}
.mn-mi{display:block;padding:14px 28px;color:rgba(242,237,216,.4);font-size:11px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;font-family:'Outfit',sans-serif;border:none;background:none;width:100%;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:color .2s;}
.mn-mi:hover{color:#f2edd8;}
.mn-mi-gold{color:#c49a3c !important;}
.mn-mi-red{color:#f87171 !important;}
.mn-mdiv{height:1px;background:rgba(196,154,60,.08);margin:8px 24px;}
@media(max-width:700px){.mn{padding:0 16px;}.mn-links{display:none;}.mn-ham{display:flex;}}
</style>
</head>
<body>
<div class="min-h-screen flex items-stretch">
  <div class="hidden lg:flex w-[45%] relative overflow-hidden items-center justify-center" style="background:radial-gradient(ellipse at 30% 40%,rgba(196,154,60,0.1),transparent 50%),radial-gradient(ellipse at 70% 70%,rgba(100,50,120,0.04),transparent 50%),#0a0b0d">
    <div class="absolute inset-0 noise"></div>
    <div class="absolute top-8 left-8 w-16 h-16 border-l border-t border-gold/10"></div>
    <div class="absolute bottom-8 right-8 w-16 h-16 border-r border-b border-gold/10"></div>
    <div class="relative text-center">
      <div class="font-display text-5xl tracking-[0.25em] font-medium text-gradient-gold">MAISON</div>
      <div class="hr-gold w-12 mx-auto my-5"></div>
      <div class="font-mono-dm text-[10px] tracking-[0.5em] uppercase text-cream/20">Fine Dining · Thane</div>
    </div>
  </div>

  <div class="flex-1 flex items-center justify-center px-8 py-12 min-h-screen relative" style="background:linear-gradient(135deg,#131518,#1a1c20)">
    <div class="absolute inset-0 noise"></div>
    <div class="w-full max-w-[420px] relative z-10 animate-fade-up">
      <a href="index.html" class="lg:hidden block font-display text-2xl tracking-[0.3em] text-gradient-gold no-underline mb-10 text-center font-medium">MAISON</a>

      <!-- Step 1 -->
      <div id="step1">
        <div class="flex items-center gap-0 mb-8">
          <div class="w-7 h-7 rounded-full flex items-center justify-center text-[11px] font-mono-dm shrink-0 bg-gold text-ink" id="dot1">1</div>
          <div class="flex-1 h-px bg-cream/10" id="line1"></div>
          <div class="w-7 h-7 rounded-full flex items-center justify-center text-[11px] font-mono-dm shrink-0 border border-cream/10 text-cream/20" id="dot2">2</div>
        </div>
        <a href="index.html" style="display:inline-flex;align-items:center;gap:6px;color:rgba(196,154,60,0.5);font-size:10px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;font-family:'Outfit',sans-serif;margin-bottom:28px;transition:color .2s;" onmouseover="this.style.color='#c49a3c'" onmouseout="this.style.color='rgba(196,154,60,0.5)'">&#8592; Home</a>
        <div class="font-mono-dm text-[10px] tracking-[0.5em] uppercase text-gold/40 mb-3">Join Us</div>
        <h1 class="font-display text-[clamp(30px,6vw,40px)] text-cream/90 font-medium mb-10">Create Account</h1>
        <div class="mb-5">
          <label class="block font-mono-dm text-[10px] tracking-[0.3em] uppercase text-cream/25 mb-2.5">Full Name</label>
          <input id="fullName" placeholder="Your full name" class="input-premium"/>
          <div id="nameErr" class="text-red-400 text-[11px] mt-1.5 font-mono-dm hidden"></div>
        </div>
        <div class="mb-5">
          <label class="block font-mono-dm text-[10px] tracking-[0.3em] uppercase text-cream/25 mb-2.5">Email</label>
          <input type="email" id="regEmail" placeholder="your@email.com" class="input-premium"/>
          <div id="emailErr" class="text-red-400 text-[11px] mt-1.5 font-mono-dm hidden"></div>
        </div>
        <div class="mb-5">
          <label class="block font-mono-dm text-[10px] tracking-[0.3em] uppercase text-cream/25 mb-2.5">Phone <span class="text-gold/30 text-[9px] tracking-normal normal-case">(optional)</span></label>
          <input id="phone" placeholder="+91 7972666151" class="input-premium"/>
        </div>
        <div class="mb-5">
          <label class="block font-mono-dm text-[10px] tracking-[0.3em] uppercase text-cream/25 mb-2.5">Password</label>
          <div class="relative">
            <input type="password" id="regPass" placeholder="Minimum 6 characters" class="input-premium pr-12" onkeydown="if(event.key==='Enter')sendOtp()"/>
            <button type="button" onclick="togglePass('regPass',this)" class="absolute right-4 top-1/2 -translate-y-1/2 bg-transparent border-none cursor-pointer text-cream/25 hover:text-cream/50 transition-colors text-sm">👁</button>
          </div>
          <div id="passErr" class="text-red-400 text-[11px] mt-1.5 font-mono-dm hidden"></div>
        </div>
        <button onclick="sendOtp()" id="sendBtn" class="btn-premium mt-3">Continue →</button>
        <div class="mt-8 text-center text-sm text-cream/25">
          Already have an account? <a href="login.html" class="text-gold/60 no-underline hover:text-gold transition-colors">Sign in</a>
        </div>
      </div>

      <!-- Step 2 -->
      <div id="step2" class="hidden">
        <div class="flex items-center gap-0 mb-8">
          <div class="w-7 h-7 rounded-full flex items-center justify-center text-[11px] font-mono-dm shrink-0 bg-gold text-ink">✓</div>
          <div class="flex-1 h-px bg-gold/40"></div>
          <div class="w-7 h-7 rounded-full flex items-center justify-center text-[11px] font-mono-dm shrink-0 bg-gold text-ink">2</div>
        </div>
        <div class="font-mono-dm text-[10px] tracking-[0.5em] uppercase text-gold/40 mb-3">Verify Email</div>
        <h1 class="font-display text-[clamp(30px,6vw,40px)] text-cream/90 font-medium mb-4">Enter OTP</h1>
        <p class="text-cream/30 text-[13px] leading-relaxed mb-6">We've sent a 6-digit code to <span class="text-gold/60 font-mono-dm" id="showEmail"></span>.</p>

        <!-- Timer -->
        <div id="otpTimerBox" class="flex items-center justify-between mb-5 px-1">
          <div id="otpTimerText" class="font-mono-dm text-[11px] text-cream/30">
            Expires in <span id="otpCountdown" class="text-gold/50">2:00</span>
          </div>
          <button id="resendBtn" onclick="resendOTP()" disabled
            class="font-mono-dm text-[11px] text-cream/20 cursor-not-allowed bg-transparent border-none transition-colors"
            style="padding:0;">Resend Code</button>
        </div>

        <label class="block font-mono-dm text-[10px] tracking-[0.3em] uppercase text-cream/25 mb-2.5">Verification Code</label>
        <div class="flex gap-2 justify-between mb-5" id="otpRow"></div>
        <button onclick="verifyOtp()" id="verifyBtn" class="btn-premium mt-4">Verify & Create Account →</button>
        <div class="mt-5">
          <button onclick="goBackStep1()" class="bg-transparent border-none cursor-pointer text-xs text-cream/25 hover:text-cream/50 transition-colors">← Edit Details</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function togglePass(id,btn){const i=document.getElementById(id);if(i.type==='password'){i.type='text';btn.textContent='🔒';}else{i.type='password';btn.textContent='👁';}}

// Build OTP inputs
const otpRow=document.getElementById('otpRow');
for(let i=0;i<6;i++){
  const inp=document.createElement('input');
  inp.maxLength=1;inp.className='input-premium otp-inp';inp.id='otp'+i;
  inp.oninput=function(){
    this.value=this.value.replace(/\D/g,'');
    if(this.value&&i<5)document.getElementById('otp'+(i+1)).focus();
  };
  inp.onkeydown=function(e){if(e.key==='Backspace'&&!this.value&&i>0)document.getElementById('otp'+(i-1)).focus();};
  otpRow.appendChild(inp);
}

// ── OTP Timer ────────────────────────────────────────────────
var otpTimerInterval = null;

function startOtpTimer() {
  var seconds = 120;
  var countEl = document.getElementById('otpCountdown');
  var textEl  = document.getElementById('otpTimerText');
  var resend  = document.getElementById('resendBtn');

  // Reset resend button to disabled state
  resend.disabled = true;
  resend.style.cssText = 'padding:0;color:rgba(242,237,216,0.2);cursor:not-allowed;background:transparent;border:none;';

  clearInterval(otpTimerInterval);
  otpTimerInterval = setInterval(function() {
    seconds--;
    var m = Math.floor(seconds / 60);
    var s = seconds % 60;
    countEl.textContent = m + ':' + (s < 10 ? '0' : '') + s;

    if (seconds <= 0) {
      clearInterval(otpTimerInterval);
      textEl.innerHTML = '<span style="color:rgba(248,113,113,0.7);">OTP expired — request a new one</span>';
      // Enable resend
      resend.disabled = false;
      resend.style.cssText = 'padding:0;color:#c49a3c;cursor:pointer;background:transparent;border:none;transition:color .2s;';
    }
  }, 1000);
}

async function sendOtp(){
  const name=document.getElementById('fullName').value.trim();
  const email=document.getElementById('regEmail').value.trim();
  const pass=document.getElementById('regPass').value;
  document.querySelectorAll('#nameErr,#emailErr,#passErr').forEach(e=>e.classList.add('hidden'));
  let ok=true;
  if(!name){document.getElementById('nameErr').textContent='Name is required';document.getElementById('nameErr').classList.remove('hidden');ok=false;}
  if(!email||!/\S+@\S+\.\S+/.test(email)){document.getElementById('emailErr').textContent='Valid email required';document.getElementById('emailErr').classList.remove('hidden');ok=false;}
  if(pass.length<6){document.getElementById('passErr').textContent='Minimum 6 characters';document.getElementById('passErr').classList.remove('hidden');ok=false;}
  if(!ok)return;
  const btn=document.getElementById('sendBtn');btn.textContent='Sending…';btn.disabled=true;
  try {
    const res=await fetch('api/send-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,purpose:'register'})});
    const data=await res.json();
    if(!data.success){
      document.getElementById('emailErr').textContent=data.message||'Failed to send OTP';
      document.getElementById('emailErr').classList.remove('hidden');
      btn.textContent='Continue →';btn.disabled=false;return;
    }
    btn.textContent='Continue →';btn.disabled=false;
    document.getElementById('step1').classList.add('hidden');
    document.getElementById('step2').classList.remove('hidden');
    document.getElementById('showEmail').textContent=email;
    document.getElementById('otp0').focus();
    startOtpTimer();
  } catch(e){
    document.getElementById('emailErr').textContent='Server error. Please try again.';
    document.getElementById('emailErr').classList.remove('hidden');
    btn.textContent='Continue →';btn.disabled=false;
  }
}

function goBackStep1(){
  clearInterval(otpTimerInterval);
  document.getElementById('step2').classList.add('hidden');
  document.getElementById('step1').classList.remove('hidden');
}

async function resendOTP(){
  const email=document.getElementById('regEmail').value.trim();
  const resend=document.getElementById('resendBtn');
  resend.textContent='Sending…';resend.disabled=true;
  resend.style.cssText='padding:0;color:rgba(242,237,216,0.2);cursor:not-allowed;background:transparent;border:none;';
  try {
    const res=await fetch('api/send-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,purpose:'register'})});
    const data=await res.json();
    if(!data.success){
      resend.textContent='Resend Code';resend.disabled=false;
      resend.style.cssText='padding:0;color:#c49a3c;cursor:pointer;background:transparent;border:none;';
      alert(data.message||'Failed to resend');return;
    }
    resend.textContent='Resend Code';
    // Reset timer
    document.getElementById('otpTimerText').innerHTML='Expires in <span id="otpCountdown" style="color:rgba(196,154,60,0.5);">2:00</span>';
    startOtpTimer();
    // Clear OTP inputs
    for(let i=0;i<6;i++){document.getElementById('otp'+i).value='';}
    document.getElementById('otp0').focus();
  } catch(e){
    resend.textContent='Resend Code';resend.disabled=false;
    resend.style.cssText='padding:0;color:#c49a3c;cursor:pointer;background:transparent;border:none;';
    alert('Server error. Please try again.');
  }
}

async function verifyOtp(){
  let code='';for(let i=0;i<6;i++)code+=document.getElementById('otp'+i).value;
  if(code.length<6){
    const btn=document.getElementById('verifyBtn');
    btn.style.boxShadow='0 0 0 2px rgba(248,113,113,0.4)';
    setTimeout(()=>btn.style.boxShadow='',1000);
    return;
  }
  const btn=document.getElementById('verifyBtn');btn.textContent='Creating Account…';btn.disabled=true;
  const email=document.getElementById('regEmail').value.trim();
  const name=document.getElementById('fullName').value.trim();
  const phone=document.getElementById('phone').value.trim();
  const pass=document.getElementById('regPass').value;
  try {
    const res=await fetch('api/verify-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,otp:code,full_name:name,phone,password:pass,purpose:'register'})});
    const data=await res.json();
    if(!data.success){
      btn.textContent='Verify & Create Account →';btn.disabled=false;
      alert(data.message||'Invalid OTP');return;
    }
    clearInterval(otpTimerInterval);
    localStorage.setItem('maison_token',data.data.token);
    localStorage.setItem('maison_user',JSON.stringify(data.data.user));
    window.location.href='book.html';
  } catch(e){
    btn.textContent='Verify & Create Account →';btn.disabled=false;
    alert('Server error. Please try again.');
  }
}
</script>
<script>
(function initNav(){
  var base=window.location.pathname.indexOf('/admin/')>-1?'../':'';
  var token=localStorage.getItem('maison_token')||'';
  var user=null;
  try{user=JSON.parse(localStorage.getItem('maison_user'));}catch(e){}
  var isAdmin=user&&user.role==='admin';
  var page=window.location.pathname.split('/').pop()||'index.html';
  function lnk(href,label,active){return '<a href="'+base+href+'" class="mn-link'+(active?' mn-active':'')+'" >'+label+'</a>';}
  var desk=document.getElementById('mnLinks');
  var mobAuth=document.getElementById('mnAuthMob');
  var mobAdmin=document.getElementById('mnAdminMob');
  if(user&&token){
    desk.innerHTML=lnk('index.html','Home',page==='index.html')+lnk('book.html','Reserve',page==='book.html')+lnk('my-bookings.html','Bookings',page==='my-bookings.html')+lnk('profile.html','Profile',page==='profile.html')+lnk('about.html','About',page==='about.html')+(isAdmin?lnk('admin/index.html','Admin',false):'')+' <button onclick="mnSignOut()" class="mn-btn">Sign Out</button>';
    if(mobAdmin&&isAdmin)mobAdmin.innerHTML='<a href="'+base+'admin/index.html" class="mn-mi mn-mi-gold">Admin Panel</a>';
    if(mobAuth)mobAuth.innerHTML='<button onclick="mnSignOut()" class="mn-mi mn-mi-red">Sign Out</button>';
  }else{
    desk.innerHTML=lnk('index.html','Home',page==='index.html')+lnk('menu.html','Menu',page==='menu.html')+lnk('book.html','Reserve',page==='book.html')+'<a href="'+base+'login.html" class="mn-btn">Sign In</a>';
    if(mobAuth)mobAuth.innerHTML='<a href="'+base+'login.html" class="mn-mi mn-mi-gold">Sign In</a><a href="'+base+'register.html" class="mn-mi">Create Account</a>';
  }
  document.querySelectorAll('.mn-drawer a[href]').forEach(function(a){var h=a.getAttribute('href');if(h&&!h.startsWith('http')&&!h.startsWith(base)&&base)a.href=base+h;});
})();
function mnToggle(){document.getElementById('mnHam').classList.toggle('open');document.getElementById('mnDrawer').classList.toggle('open');}
document.addEventListener('click',function(e){var h=document.getElementById('mnHam'),d=document.getElementById('mnDrawer');if(h&&d&&!h.contains(e.target)&&!d.contains(e.target)){h.classList.remove('open');d.classList.remove('open');}});
window.addEventListener('scroll',function(){document.getElementById('mainNav').classList.toggle('scrolled',window.scrollY>10);});
function mnSignOut(){localStorage.removeItem('maison_token');localStorage.removeItem('maison_user');window.location.href=(window.location.pathname.indexOf('/admin/')>-1?'../':'')+'index.html';}
</script>

</body>
</html>
