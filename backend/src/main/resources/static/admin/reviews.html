<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Reviews — Maison Admin</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0b0d'/><text y='26' x='4' font-size='24' fill='%23c49a3c' font-family='Georgia,serif'>M</text></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="admin.css"/>
</head>
<body>

<div id="sidebar-overlay" onclick="closeSidebar()"></div>

<aside id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-mark">
      <div class="logo-gem">M</div>
      <div>
        <div class="logo-text">Maison</div>
        <div class="logo-sub">Admin Panel</div>
      </div>
    </div>
  </div>
  <div class="nav-items">
    <div class="nav-section">Main</div>
    <a href="index.html"        class="nav-item"><span class="nav-icon">◈</span> Dashboard</a>
    <a href="reservations.html" class="nav-item"><span class="nav-icon">◧</span> Reservations <span class="nav-badge" id="pending-badge">0</span></a>
    <a href="tables.html"       class="nav-item"><span class="nav-icon">⬡</span> Tables</a>
    <div class="nav-section">People</div>
    <a href="customers.html"    class="nav-item"><span class="nav-icon">◉</span> Customers</a>
    <div class="nav-section">Analytics</div>
    <a href="reports.html"      class="nav-item"><span class="nav-icon">▦</span> Reports</a>
    <div class="nav-section">Content</div>
    <a href="reviews.html"      class="nav-item active"><span class="nav-icon">★</span> Reviews <span class="nav-badge" id="reviews-pending-badge">0</span></a>
    <div class="nav-section">System</div>
    <a href="settings.html"     class="nav-item"><span class="nav-icon">⚙</span> Settings</a>
  </div>
  <div class="sidebar-footer">
    <div class="user-card">
      <div class="avatar">A</div>
      <div>
        <div class="user-name" id="admin-name">Admin</div>
        <div class="user-role">● ADMIN</div>
      </div>
      <button class="logout-btn" title="Sign out" onclick="doLogout()">⇥</button>
    </div>
  </div>
</aside>

<div id="main">
  <div class="topbar">
    <div class="topbar-left">
      <button class="hamburger-btn" onclick="toggleSidebar()">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h14M3 10h14M3 14h14"/></svg>
      </button>
      <div>
        <div class="topbar-title">Reviews</div>
        <div class="topbar-crumb">Maison / Reviews</div>
      </div>
    </div>
    <div class="topbar-right">
      <div id="review-stats" style="font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);"></div>
    </div>
  </div>

  <div class="page-content">

    <!-- Filter tabs -->
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center;">
      <div style="display:flex;gap:6px;flex-wrap:wrap;" id="status-filters"></div>
    </div>

    <div class="card">
      <div class="tbl-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Guest</th>
              <th>Booking</th>
              <th>Overall</th>
              <th>🍽️ Food</th>
              <th>🤝 Service</th>
              <th>✨ Ambience</th>
              <th>Comment</th>
              <th>Submitted</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="reviews-tbody">
            <tr><td colspan="10" style="text-align:center;color:var(--muted);padding:40px;">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<div id="toast-container"></div>
<script src="admin.js"></script>
<script>
let allReviews   = [];
let activeFilter = '';

function buildFilters() {
  const opts = [['','All'],['pending','Pending'],['approved','Approved']];
  document.getElementById('status-filters').innerHTML = opts.map(([val, label]) => {
    const isActive = activeFilter === val;
    const color = val === 'pending' ? 'var(--amber)' : val === 'approved' ? 'var(--green)' : 'var(--text)';
    const bg    = val === 'pending' ? 'rgba(251,191,36,0.1)' : val === 'approved' ? 'rgba(62,207,142,0.1)' : 'var(--surface3)';
    const border= val === 'pending' ? 'var(--amber)' : val === 'approved' ? 'var(--green)' : 'var(--border2)';
    return `<button onclick="activeFilter='${val}';buildFilters();renderTable()" style="
      background:${isActive ? bg : 'transparent'};
      border:1px solid ${isActive ? border : 'var(--border)'};
      color:${isActive ? color : 'var(--muted2)'};
      border-radius:100px;font-size:11px;cursor:pointer;
      font-family:'DM Mono',monospace;padding:4px 14px;
    ">${label}</button>`;
  }).join('');
}

function renderStars(n) {
  return Array.from({length:5}, (_,i) =>
    `<span style="color:${i < n ? '#c49a3c' : 'var(--border2)'};">★</span>`
  ).join('');
}

function renderTable() {
  let list = [...allReviews];
  if (activeFilter) list = list.filter(r => r.status === activeFilter);

  if (list.length === 0) {
    document.getElementById('reviews-tbody').innerHTML =
      `<tr><td colspan="10" style="text-align:center;color:var(--muted);padding:40px;">No reviews found</td></tr>`;
    return;
  }

  document.getElementById('reviews-tbody').innerHTML = list.map(r => `
    <tr>
      <td>
        <div style="font-weight:500;">${r.full_name}</div>
        <div style="font-size:11px;color:var(--muted2);">${r.email}</div>
      </td>
      <td>
        <div style="font-family:'DM Mono',monospace;font-size:12px;color:var(--blue);">${r.booking_ref}</div>
        <div style="font-size:11px;color:var(--muted2);">${r.reservation_date}</div>
      </td>
      <td><span style="font-size:15px;letter-spacing:1px;">${renderStars(parseInt(r.rating))}</span></td>
      <td style="font-family:'DM Mono',monospace;font-size:12px;color:var(--amber);">${r.food_rating ? r.food_rating + ' ★' : '—'}</td>
      <td style="font-family:'DM Mono',monospace;font-size:12px;color:var(--blue);">${r.service_rating ? r.service_rating + ' ★' : '—'}</td>
      <td style="font-family:'DM Mono',monospace;font-size:12px;color:var(--purple);">${r.ambience_rating ? r.ambience_rating + ' ★' : '—'}</td>
      <td style="max-width:200px;">
        <div style="font-size:13px;color:var(--muted2);line-height:1.5;white-space:normal;">${r.comment || '<span style="color:var(--muted);font-style:italic;">No comment</span>'}</div>
      </td>
      <td style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);">${r.created_at.slice(0,10)}</td>
      <td>
        <span class="pill ${r.status === 'approved' ? 'pill-green' : 'pill-amber'}">${r.status}</span>
      </td>
      <td>
        <div style="display:flex;gap:6px;">
          ${r.status === 'pending'
            ? `<button onclick="doAction(${r.id},'approve')" class="btn btn-primary" style="padding:5px 12px;font-size:11px;">Approve</button>`
            : ''}
          <button onclick="doAction(${r.id},'delete')" class="btn btn-danger" style="padding:5px 12px;font-size:11px;">Delete</button>
        </div>
      </td>
    </tr>`).join('');
}

async function doAction(id, action) {
  if (action === 'delete' && !confirm('Delete this review permanently?')) return;
  const res = await apiCall('POST', 'update-review', { id, action });
  if (!res.success) { toast(res.message, 'error'); return; }
  toast(action === 'approve' ? 'Review approved ✓' : 'Review deleted');
  loadReviews();
}

async function loadReviews() {
  const res = await apiCall('POST', 'get-all-reviews');
  if (!res.success) { toast(res.message, 'error'); return; }

  allReviews = res.data.reviews || [];
  const pending  = res.data.pending_count || 0;
  const approved = allReviews.filter(r => r.status === 'approved').length;
  const total    = allReviews.length;
  const avg      = total > 0
    ? (allReviews.reduce((s,r) => s + parseInt(r.rating), 0) / total).toFixed(1)
    : '—';

  document.getElementById('reviews-pending-badge').textContent = pending;
  document.getElementById('review-stats').innerHTML =
    `★ ${avg} avg &nbsp;·&nbsp; ${approved} approved &nbsp;·&nbsp; ${pending} pending`;

  buildFilters();
  renderTable();
}

loadReviews();
</script>
</body>
</html>
