server.port=${PORT:8080}
server.servlet.context-path=/

restaurant.name=Maison Fine Dining
restaurant.tagline=Est. 2018 · Thane
restaurant.address=Anand Nagar, Thane, Mumbai, Maharashtra, India
restaurant.phone=+91 7972666151
restaurant.email=${MAIL_USERNAME:maisonadmin007@gmail.com}
restaurant.city=Thane
restaurant.url=${APP_URL:http://localhost:8080}
restaurant.max-active-bookings=2
restaurant.no-show-block-limit=3
restaurant.table-block-hours=2
restaurant.wa-enabled=true
restaurant.wa-business-number=917972666151

# Supabase PostgreSQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Frontend is bundled into the Spring Boot JAR
spring.web.resources.static-locations=classpath:/static/
