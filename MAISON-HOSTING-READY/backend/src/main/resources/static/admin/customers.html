<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Customers — Maison Admin</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0b0d'/><text y='26' x='4' font-size='24' fill='%23c49a3c' font-family='Georgia,serif'>M</text></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="admin.css"/>
</head>
<body>

<div id="sidebar-overlay" onclick="closeSidebar()"></div>
<aside id="sidebar">
  <div class="sidebar-logo"><div class="logo-mark"><div class="logo-gem">M</div><div><div class="logo-text">Maison</div><div class="logo-sub">Admin Panel</div></div></div></div>
  <div class="nav-items">
    <div class="nav-section">Main</div>
    <a href="index.html"        class="nav-item"><span class="nav-icon">◈</span> Dashboard</a>
    <a href="reservations.html" class="nav-item"><span class="nav-icon">◧</span> Reservations</a>
    <a href="tables.html"       class="nav-item"><span class="nav-icon">⬡</span> Tables</a>
    <div class="nav-section">People</div>
    <a href="customers.html"    class="nav-item active"><span class="nav-icon">◉</span> Customers</a>
    <div class="nav-section">Analytics</div>
    <a href="reports.html"      class="nav-item"><span class="nav-icon">▦</span> Reports</a>
    <div class="nav-section">Content</div>
    <a href="reviews.html"      class="nav-item"><span class="nav-icon">★</span> Reviews <span class="nav-badge" id="reviews-pending-badge">0</span></a>
    <div class="nav-section">System</div>
    <a href="settings.html"     class="nav-item"><span class="nav-icon">⚙</span> Settings</a>
  </div>
  <div class="sidebar-footer"><div class="user-card"><div class="avatar">A</div><div><div class="user-name" id="admin-name">Admin</div><div class="user-role">● ADMIN</div></div><button class="logout-btn" onclick="doLogout()">⇥</button></div></div>
</aside>

<div id="main">
  <div class="topbar">
    <div class="topbar-left">
      <button class="hamburger-btn" onclick="toggleSidebar()"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h14M3 10h14M3 14h14"/></svg></button>
      <div><div class="topbar-title">Customers</div><div class="topbar-crumb">Maison / Customers</div></div>
    </div>
  </div>

  <div class="page-content">
    <div style="margin-bottom:16px;">
      <div style="display:inline-flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 14px;">
        <svg width="13" height="13" fill="none" stroke="var(--muted)" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="cust-search" class="inp" style="background:none;border:none;padding:0;width:200px;font-size:13px;" placeholder="Search name or email…" oninput="filterCustomers()"/>
      </div>
    </div>
    <div class="card">
      <div class="tbl-wrap">
        <table class="data-table">
          <thead><tr><th>Guest</th><th>Email</th><th>Phone</th><th>Bookings</th><th>Notes</th></tr></thead>
          <tbody id="cust-tbody"><tr><td colspan="5" style="text-align:center;color:var(--muted);padding:40px;">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Notes Modal -->
<div class="modal-bg" id="notes-modal">
  <div class="modal">
    <div class="modal-head"><div class="modal-title">Guest Notes</div><button class="modal-close" onclick="closeModal('notes-modal')">×</button></div>
    <div class="modal-body">
      <div id="notes-guest-info" style="margin-bottom:14px;font-size:12px;color:var(--muted2);"></div>
      <div class="form-group">
        <label class="form-label">Internal Notes</label>
        <textarea class="inp" id="notes-ta" rows="4" placeholder="Dietary restrictions, preferences, VIP notes…" style="resize:vertical;"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('notes-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveNotes()">Save Notes</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="admin.js"></script>
<script>
let allCustomers = [];
let activeNotesUserId = null;

async function loadCustomers() {
  const res = await apiCall('POST', 'get-customers');
  if (!res.success) { toast(res.message, 'error'); return; }
  allCustomers = res.data.customers || [];
  renderCustomers(allCustomers);
}

function filterCustomers() {
  const q = document.getElementById('cust-search').value.toLowerCase();
  const filtered = !q ? allCustomers : allCustomers.filter(c =>
    c.full_name.toLowerCase().includes(q) || c.email.toLowerCase().includes(q)
  );
  renderCustomers(filtered);
}

function renderCustomers(customers) {
  document.getElementById('cust-tbody').innerHTML = customers.length === 0
    ? '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:40px;">No customers found</td></tr>'
    : customers.map(c => `
      <tr>
        <td><div style="font-weight:500;">${c.full_name}${c.is_blocked ? '<span style="margin-left:8px;background:#c0392b20;color:#c0392b;font-size:10px;padding:2px 8px;border-radius:2px;letter-spacing:1px;">BLOCKED</span>' : ''}${c.no_show_count > 0 ? '<span style="margin-left:4px;background:#7a6a3520;color:#c49a3c;font-size:10px;padding:2px 8px;border-radius:2px;">'+ c.no_show_count +' no-show'+(c.no_show_count>1?'s':'')+ '</span>' : ''}</div></td>
        <td style="font-size:12px;color:var(--muted2);">${c.email}</td>
        <td style="font-size:12px;color:var(--muted2);">${c.phone || '—'}</td>
        <td><span style="font-family:'DM Mono',monospace;font-size:13px;color:${c.booking_count>=5?'var(--green)':'var(--text)'};">${c.booking_count}</span></td>
        <td>
          <button onclick="openNotesModal(${c.id},'${c.full_name.replace(/'/g,"\\'")}','${c.email}')" class="btn btn-ghost btn-sm">
            ${c.note ? '✎ Edit Notes' : '+ Add Notes'}
          </button>
        </td>
      </tr>`).join('');
}

function openNotesModal(id, name, email) {
  activeNotesUserId = id;
  document.getElementById('notes-guest-info').textContent = name + ' · ' + email;
  const cust = allCustomers.find(c => c.id == id);
  document.getElementById('notes-ta').value = cust?.note || '';
  openModal('notes-modal');
}

async function saveNotes() {
  const note = document.getElementById('notes-ta').value;
  const res = await apiCall('POST', 'save-notes', { user_id: activeNotesUserId, note });
  if (!res.success) { toast(res.message, 'error'); return; }
  closeModal('notes-modal');
  toast('Notes saved');
  loadCustomers();
}

loadCustomers();
</script>
</body>
</html>
